[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimalportfolios"
version = "6.17.0"
description = "Implementation of optimisation analytics for constructing and backtesting optimal portfolios in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
maintainers = [
    {name = "Artur Sepp", email = "artursepp@gmail.com"},
]
keywords = [
    "portfolio optimization",
    "quantitative finance",
    "asset allocation",
    "risk budgeting",
    "backtesting",
    "covariance estimation",
    "lasso regularization",
    "cvxpy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

dependencies = [
    "numpy>=2.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0",
    "cvxpy>=1.3.0",
    "quadprog>=0.1.11",
    "qis>=5.7.0",
    "factorlasso>=0.14.0",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2.40",
]

reports = [
    "pybloqs>=1.2.13",
]

docs = [
    "sphinx>=7.2",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
]

# There is no `jupyter` extra. It declared jupyter, notebook and jupyterlab, none of which this
# package imports and none of which any file here needs: the repository contains no notebook.
# It also pulled the unused notebook stack into `[all]` and the daily `--all-extras` audit.
# Install notebook tooling alongside the package when needed.
#
# Test dependencies only, and nothing else. The lint tools are not here: they gate the repository
# rather than support the suite, they are never imported by a test, and installing them into all
# twelve matrix cells bought nothing. They live in the `lint` dependency-group below.
#
# Two entries were removed for the same reason -- neither enabled a single test. Collection is
# 1277 tests with them and 1277 without:
#
#   * `optimalportfolios[data]` was here for the *examples*, not the suite. No test imports
#     yfinance; the eleven files that do all live under root-level `examples/`, which is
#     excluded from wheels and never collected. Keeping it here meant every cell of the test
#     matrix installed yfinance, so no cell could establish that an optional package is absent --
#     the matrix silently contradicted the constraint `core-install` exists to enforce.
#   * `networkx` was orphaned by 981f7e0, which moved the risk-lineage analytics to FactorLasso.
#     It has no reference anywhere in this repository.
#
# To run the examples, install the extra they actually need: `[dev,data]`, or `[all]`.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[dependency-groups]
# The versions CI gates with, stated once. These were previously declared twice -- as open
# floors here (`ruff>=0.4`) and as the real pins in the workflow (`ruff~=0.16.0`) -- so a
# contributor's local ruff and CI's ruff could disagree about the same file. A PEP 735 group is
# the right home: it is not an extra, so it never ships to a user and never reaches a core
# install, and unlike a `dev` group it is not synced by default, so the test matrix skips it too.
#
# Pinned exactly, not to a series. These tools decide whether a change is allowed to land, and a
# range does not make that verdict reproducible: `ruff~=0.16.0` admits any 0.16.x, and every ruff
# patch release is entitled to add or fix a rule, so the same unchanged source can pass today and
# fail tomorrow with nothing in this repository having moved. An exact pin makes a verdict change
# a reviewed commit rather than an upstream event. Bumping is a deliberate PR: raise the version
# here, re-lock, and fix whatever the new release now reports.
lint = [
    "ruff==0.16.2",
    "interrogate==1.7.0",
]

# `pip-audit` is separated from `lint` because it is not a source gate: it reads the resolved
# dependency set and the advisory database, and audit.yml is the only caller. Exact for the same
# reason as above -- the tool version must not be a free variable when a run turns red -- though
# note that what this pin fixes is the *scanner*, not the verdict: the advisory database it
# queries is remote and updates continuously, which is the intended behaviour for a daily audit.
audit = [
    "pip-audit==2.10.1",
]

all = [
    "optimalportfolios[data,reports]",
]

[project.urls]
Homepage = "https://github.com/ArturSepp/OptimalPortfolios"
Documentation = "https://optimalportfolios.readthedocs.io"
Repository = "https://github.com/ArturSepp/OptimalPortfolios.git"
Issues = "https://github.com/ArturSepp/OptimalPortfolios/issues"
Changelog = "https://github.com/ArturSepp/OptimalPortfolios/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["optimalportfolios*"]
exclude = ["examples*", "docs*", "papers*"]

[tool.setuptools.package-data]
optimalportfolios = ["*.yaml"]
"optimalportfolios.tests.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["optimalportfolios"]
addopts = "-ra -q --tb=short"

# `papers/` reproduces published code and is left exactly as-is.
[tool.ruff]
line-length = 100
exclude = ["papers"]

[tool.ruff.lint]
select = ["E", "F", "W"]

# --- stack invariants as lint, not prose ---------------------------------------------------
# TID251 bans an import outright, TID253 bans it only at module level, ICN pins the numpy and
# pandas aliases. None belongs to the "I" (isort) family, so the import-grouping convention is
# untouched. Verified green on the repository as it stands.
extend-select = ["TID251", "TID253", "ICN"]

# --- what CI gates, and why it is not everything --------------------------------------------
# CI gates TID251,TID253,ICN,F. All four are green on the whole package, so a finding is always
# something the change under review introduced.
#
# `E` and `W` stay ungated because of the ~380 E501 line-length findings in the older modules.
# Those are a deliberate backlog: fix the lines your change touches, and do not reflow the
# repository. `F` was separated from them because it is a correctness family — an unused
# import, an undefined name, a dropped assignment — not a formatting preference.

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# A1: optimalportfolios depends on qis and factorlasso, and on nothing else in the stack.
# Subject packages never import each other.
"trendfollowing".msg = "A1: subject packages never import each other."
"privateassets".msg = "A1: subject packages never import each other."
"stochvolmodels".msg = "A1: subject packages never import each other."
"goal_based_allocation".msg = "A1: subject packages never import each other."
"vanilla_option_pricers".msg = "A1: subject packages never import each other."

[tool.ruff.lint.flake8-tidy-imports]
# A3: an optional extra is imported inside a function and guarded, never at module level, so a
# core install keeps working. A module dedicated to a single optional backend is the documented
# exception and is named in per-file-ignores below.
banned-module-level-imports = ["yfinance", "pandas_datareader", "pybloqs", "plotly", "pyarrow",
                               "psycopg2", "sqlalchemy"]

[tool.ruff.lint.flake8-import-conventions.aliases]
# replaces ruff's default alias map, which also demands `matplotlib as mpl` everywhere. Only
# numpy and pandas are house convention; matplotlib is legitimately both `mpl` and `plt` here.
numpy = "np"
pandas = "pd"

[tool.ruff.lint.per-file-ignores]
# An `__init__.py` here is a re-export layer: an import is present *because* it belongs to the
# subpackage's public surface, and the star imports in the top-level `__init__.py` are how that
# surface is assembled. F401 (unused import) and F403 (star import) describe both as faults, so
# they are off for that one filename rather than answered file by file with `# noqa`. The rule
# this preserves: adding a public import must not require maintaining a second list beside it.
"__init__.py" = ["F401", "F403"]
# examples are documentation and run top to bottom
"examples/**" = ["TID253"]
# module dedicated to the pybloqs backend; not reachable from optimalportfolios/__init__.py
"optimalportfolios/reports/portfolio_result_pybloqs.py" = ["TID253"]
# module dedicated to the plotly backend in the private rosaa tree. The layer is a leaf that
# nothing above it imports at module level, so a core install never reaches this import.
"rosaa/universe_profiler/figures.py" = ["TID253"]
"rosaa/universe_profiler/report_html.py" = ["TID253"]

[tool.interrogate]
# Docstring coverage is at 100% on the package, so a miss is always something just
# introduced — the same argument that puts the three stack invariants in ruff.
# `papers/` is excluded for the reason it is excluded from ruff: it reproduces
# published code and is left exactly as-is. `rosaa/` is gitignored and not ours.
fail-under = 100
exclude = ["papers", "rosaa", ".codex_analysis", "outputs", "tmp", "quant_strats"]

[tool.coverage.run]
source = ["optimalportfolios"]
# `reports/` is presentation: it renders factsheets through `qis` and `pybloqs` and is exercised
# by eye, not by assertion. Measuring it only diluted the number the ratchet below defends, so it
# is omitted rather than left as a permanent 4% drag. Anything with a numerical contract belongs
# outside `reports/` and is measured.
omit = ["*/tests/*", "*/examples/*", "papers/*", "*/reports/*"]

[tool.coverage.report]
# A ratchet, not a target: the floor sits just under the measured level so coverage cannot
# regress silently, and it is raised as tests land.
#
# Measure on a `[dev]` install, which is what the 3.12 leg of the `test` job in ci.yml does.
# That is now pytest and pytest-cov over the core tree: the suite collects the same 1277 tests
# with or without the optional extras, so the measured scope does not depend on them.
fail_under = 99
