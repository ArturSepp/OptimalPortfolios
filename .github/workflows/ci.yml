name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push to a PR branch makes the run already in flight for that branch pointless: this workflow
# is 15 jobs, so cancelling it is the single largest saving available here. Runs on `main` are
# keyed per-ref and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

# This workflow is the part of CI that needs the package installed. The checks that do not --
# ruff and interrogate in static.yml, pip-audit in audit.yml -- run in parallel with it.
jobs:
  test:
    # The suite is pure-Python and NaN-aware pandas, but the scientific stack ships per-platform
    # wheels and pandas frequency/locale behaviour has bitten this kind of code before, so the
    # matrix runs every supported Python on all three runners.
    #
    # `primary` marks the one cell -- ubuntu/3.12 -- that syncs `--locked` from uv.lock, runs the
    # offline example and gates coverage. It is set through `include` so the pinned and floating
    # legs are one step each instead of two near-identical pairs; the remaining cells leave it
    # unset, which is falsy in an expression.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            primary: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        # uv supplies the interpreter as well as the installer, so there is no separate
        # setup-python step. The version has to be passed explicitly: `.python-version` is
        # gitignored, so there is no in-repo file for uv to discover.
        python-version: ${{ matrix.python-version }}
        # `enable-cache` defaults to `auto` -- on for push and pull_request on GitHub-hosted
        # runners -- and the default `cache-dependency-glob` already covers pyproject.toml and
        # uv.lock. The cache holds downloaded and built wheels, not a resolution, so the
        # deliberately floating cells keep floating.

    - name: Sync the environment
      # The pinned and floating legs differ by one flag rather than by a whole step.
      #
      # `--locked` on the primary cell installs the lock exactly and *fails* if uv.lock has
      # drifted from pyproject.toml, which is what stops a dependency edit landing without a
      # re-lock. Everywhere else `--upgrade` re-resolves from the floors and ignores the lock, so
      # the matrix keeps testing what a user installing today would actually get. That float is
      # the point of the other eleven cells; pinning them would only test the lock twelve times.
      #
      # No pip bootstrap step: pyproject.toml declares PEP 639 `license` and `license-files`, so
      # the built metadata is Metadata-Version 2.4. The pip shipped with the older interpreters in
      # this matrix cannot read that and had to be upgraded first; uv reads it natively.
      #
      # Retried because this step talks to PyPI and the failures observed here are transport, not
      # resolution: runners have hit `dns error: failed to lookup address information` on
      # files.pythonhosted.org, which fails the whole matrix cell over a name lookup. uv's own
      # `--retries` covers a request, but it gives up while the resolver is still mid-flight, so
      # the retry has to wrap the command as well. Backoff is 15s then 45s -- long enough to
      # outlast a DNS or CDN blip, and three attempts total still fails fast on a real error like
      # an unresolvable constraint, which loses ~1 minute rather than masking anything.
      #
      # `--upgrade` cells resolve against the live index and so carry the whole exposure;
      # `--locked` still downloads. Both take the same wrapper.
      shell: bash
      run: |
        sync_cmd=(uv sync --extra dev ${{ matrix.primary && '--locked' || '--upgrade' }})
        for attempt in 1 2 3; do
          if "${sync_cmd[@]}"; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::uv sync failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 30 - 15))
          echo "::warning::uv sync attempt $attempt failed; retrying in ${delay}s"
          sleep "$delay"
        done

    - name: Verify the public import surface
      # bash on every runner: the default shell on windows-latest is PowerShell, which parses this
      # multi-line quoted argument differently.
      shell: bash
      run: |
        uv run python -c "
        from optimalportfolios import (
            PortfolioObjective, Constraints, GroupLowerUpperConstraints,
            FactorCovarEstimator, EwmaCovarEstimator
        )
        from factorlasso import LassoModel as FL_LassoModel
        from optimalportfolios import LassoModel as OP_LassoModel
        assert FL_LassoModel is OP_LassoModel, 'factorlasso re-export mismatch'
        print('imports and factorlasso integration OK')
        "

    - name: Smoke-test the offline multi-asset example
      if: matrix.primary
      run: uv run python optimalportfolios/examples/backtests/multiasset_saa.py

    - name: Run the test suite
      # On the primary cell only, coverage is measured and gated. The floor lives in
      # [tool.coverage.report] fail_under in pyproject.toml, so this fails when coverage regresses
      # below it; term-missing prints the uncovered lines, which is what a contributor needs to act
      # on the failure without re-running locally.
      #
      # Measured on one cell so the floor keeps one authoritative number. A platform-specific skip
      # on another runner would otherwise fail the gate there for a reason that has nothing to do
      # with coverage regressing.
      run: uv run pytest ${{ matrix.primary && '--cov=optimalportfolios --cov-report=term-missing' || '' }}

  core-install:
    # The suite must stay green without the optional extras: no test may need data, network or a
    # Bloomberg terminal. Without this job the constraint is a convention, and it has already been
    # broken twice by a module-scope yfinance import.
    #
    # All three runners, not one. An earlier revision of this branch narrowed it to ubuntu on the
    # argument that "no optional extra is installed" is a property of the dependency graph and so
    # is platform-invariant. That argument is wrong: environment markers are evaluated per
    # platform, wheel availability differs, and a transitive dependency can be pulled in on one OS
    # and not another -- so the resolved core set is genuinely a per-platform question.
    #
    # `test` does not subsume this job, though the gap is narrower than it was. Now that `[dev]`
    # is pytest and pytest-cov alone, that matrix does run the suite on something close to a core
    # environment -- but "close" is the whole problem. It syncs an extra rather than none, it
    # asserts nothing about what is importable, and `[dev]` is one dependency edit away from
    # dragging an optional package back in. That is exactly how this broke twice before. This job
    # is the standing guard: zero extras by construction, and an explicit assertion rather than an
    # inference from what happens to be declared today.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        python-version: "3.12"

    - name: Sync the core environment
      # A bare `uv sync` is exactly the core install: it takes no extras, and `lint` is a
      # non-default dependency-group, so neither the optional extras nor the tools are present.
      run: uv sync --locked

    - name: Assert the optional extras are absent
      # The runtime half of TID253, checked on the environment that was actually built, on each of
      # the three platforms. Ruff proves no *first-party* module imports these at module scope, but
      # it has per-file ignores and cannot see a transitive arrival -- a core dependency taking one
      # of them on as a hard requirement passes the lint and lands in what users get from a bare
      # `pip install optimalportfolios`. That has already broken this project twice.
      #
      # The list is read from `banned-module-level-imports` in pyproject.toml rather than repeated
      # here: repeating it is how this step came to check three of the seven names, leaving plotly,
      # pyarrow, psycopg2 and sqlalchemy unguarded.
      #
      # This asks the import system, not a requirements file, so it answers the question that
      # matters on this specific runner -- markers and wheel availability have already been
      # resolved by the time it runs. The complementary check in audit.yml resolves a *fresh* core
      # tree daily and catches drift this locked environment cannot show; neither subsumes the
      # other.
      shell: bash
      run: |
        uv run --no-sync python - <<'PY'
        import importlib.util, sys, tomllib

        with open("pyproject.toml", "rb") as fh:
            cfg = tomllib.load(fh)
        banned = cfg["tool"]["ruff"]["lint"]["flake8-tidy-imports"]["banned-module-level-imports"]
        assert banned, "the ban list is empty; this check would assert nothing"

        present = [m for m in banned if importlib.util.find_spec(m) is not None]
        if present:
            sys.exit(
                "optional modules are importable in a core install: " + ", ".join(present)
                + "\nEither a core dependency took one on as a hard requirement, or a dependency "
                  "edit moved it out of an extra."
            )
        print(f"core install clean: none of the {len(banned)} banned modules are importable")
        PY

    - name: Run the test suite on a core install
      # `--with pytest` layers the runner on top of the synced environment instead of installing
      # it into it, so the thing under test stays a core install exactly. pytest brings only
      # iniconfig, packaging and pluggy, none of which is an optional extra.
      run: uv run --with pytest pytest
