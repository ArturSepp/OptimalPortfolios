name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify imports
      run: |
        python -c "
        from optimalportfolios import (
            PortfolioObjective, Constraints, GroupLowerUpperConstraints,
            FactorCovarEstimator, EwmaCovarEstimator
        )
        print('All imports OK')
        "

    - name: Verify factorlasso integration
      run: |
        python -c "
        from factorlasso import LassoModel as FL_LassoModel
        from optimalportfolios import LassoModel as OP_LassoModel
        assert FL_LassoModel is OP_LassoModel, 'Re-export mismatch'
        print('factorlasso integration OK')
        "

    - name: Run the test suite
      run: pytest

  core-install:
    # The suite must stay green without the optional extras: no test may need
    # data, network or a Bloomberg terminal. Without this job the constraint is
    # a convention, and it has already been broken twice by a module-scope
    # yfinance import.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install the core package only
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Assert the optional extras are absent
      run: |
        python -c "
        import importlib.util
        for name in ('yfinance', 'pandas_datareader', 'pybloqs'):
            assert importlib.util.find_spec(name) is None, f'{name} leaked into the core install'
        print('core install confirmed')
        "

    - name: Run the test suite on a core install
      run: pytest
