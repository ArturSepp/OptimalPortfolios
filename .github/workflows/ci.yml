# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: CI

# Least privilege, declared rather than inherited. Without this block every job runs with the
# repository's *default* `GITHUB_TOKEN` scope, which on a repository configured for read-write
# defaults is write access to contents, issues, packages and more -- handed to fourteen matrix cells
# that only check out a tree and run pytest.
#
# Nothing in this workflow uses the token: no `gh` call, no artifact upload, no PR comment, no push.
# `contents: read` is what `actions/checkout` needs and is therefore the whole requirement. Declared
# at workflow level so a new job inherits the restriction instead of the default.
#
# This matters most for `pull_request`, which is the trigger that runs contributor-authored changes
# to workflow-adjacent files. Scope is the containment; add a permission to the one job that needs
# it if that ever changes, never here.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push to a PR branch makes the run already in flight for that branch pointless: this workflow
# is 14 matrix jobs plus the wheel job, so cancelling it is the single largest saving available
# here. Runs on `main` are
# keyed per-ref and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

# This workflow is the part of CI that needs the package installed. The checks that do not --
# ruff and interrogate in static.yml, pip-audit in audit.yml -- run in parallel with it.
jobs:
  test:
    # The suite is pure-Python and NaN-aware pandas, but the scientific stack ships per-platform
    # wheels and pandas frequency/locale behaviour has bitten this kind of code before, so the
    # matrix runs every supported Python on all three runners except the documented Windows/3.14
    # dependency-wheel exclusion below.
    #
    # `primary` marks the one cell -- ubuntu/3.12 -- that syncs `--locked` from uv.lock and gates
    # coverage. It is set through `include` so the pinned and floating
    # legs are one step each instead of two near-identical pairs; the remaining cells leave it
    # unset, which is falsy in an expression.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # 3.14 excluded 2026-08-22: quadprog==0.1.13 provides no cp314 Windows wheel.
          - os: windows-latest
            python-version: "3.14"
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            primary: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # uv supplies the interpreter as well as the installer, so there is no separate
        # setup-python step. The version has to be passed explicitly: `.python-version` is
        # gitignored, so there is no in-repo file for uv to discover.
        python-version: ${{ matrix.python-version }}
        # `enable-cache` defaults to `auto` -- on for push and pull_request on GitHub-hosted
        # runners -- and the default `cache-dependency-glob` already covers pyproject.toml and
        # uv.lock. The cache holds downloaded and built wheels, not a resolution, so the
        # deliberately floating cells keep floating.

    - name: Sync the environment
      # The pinned and floating legs differ by one flag rather than by a whole step.
      #
      # `--locked` on the primary cell installs the lock exactly and *fails* if uv.lock has
      # drifted from pyproject.toml, which is what stops a dependency edit landing without a
      # re-lock. Everywhere else `--upgrade` re-resolves from the floors and ignores the lock, so
      # the matrix keeps testing what a user installing today would actually get. That float is
      # the point of the other thirteen cells; pinning them would only test the lock fourteen times.
      #
      # No pip bootstrap step: pyproject.toml declares PEP 639 `license` and `license-files`, so
      # the built metadata is Metadata-Version 2.4. The pip shipped with the older interpreters in
      # this matrix cannot read that and had to be upgraded first; uv reads it natively.
      #
      # Retried because this step talks to PyPI and the failures observed here are transport, not
      # resolution: runners have hit `dns error: failed to lookup address information` on
      # files.pythonhosted.org, which fails the whole matrix cell over a name lookup. uv's own
      # `--retries` covers a request, but it gives up while the resolver is still mid-flight, so
      # the retry has to wrap the command as well. Backoff is 15s then 45s -- long enough to
      # outlast a DNS or CDN blip, and three attempts total still fails fast on a real error like
      # an unresolvable constraint, which loses ~1 minute rather than masking anything.
      #
      # `--upgrade` cells resolve against the live index and so carry the whole exposure;
      # `--locked` still downloads. Both take the same wrapper.
      shell: bash
      run: |
        sync_cmd=(uv sync --group test ${{ matrix.primary && '--locked' || '--upgrade' }})
        for attempt in 1 2 3; do
          if "${sync_cmd[@]}"; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::uv sync failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 30 - 15))
          echo "::warning::uv sync attempt $attempt failed; retrying in ${delay}s"
          sleep "$delay"
        done

    # There is no inline import-surface step here any more. It imported five public names and
    # asserted that one of the nine factorlasso re-exports was the same object as its source;
    # `src/optimalportfolios/tests/public_api_test.py` checks every public name and all nine
    # re-exports on every matrix cell, so the inline version was strictly weaker in a job the
    # suite already covers. That file's docstring records the move.
    # Add public-surface contracts there, not back into this workflow.
    #
    # The multiasset_saa.py smoke test has moved to examples.yml, which runs that example and the
    # four other offline ones on all three runners instead of on this one primary cell, and puts
    # the eighteen network-bound examples on a schedule. Executing examples is not this
    # workflow's job.

    - name: Assert optional modules are absent
      # The `test` group is only pytest and pytest-cov over the core tree. Check the actual 3.12 environment
      # on all three operating systems so platform-specific markers or wheels cannot make an
      # optional backend arrive unnoticed. audit.yml complements this locked/floating install
      # check with a fresh Linux resolution each day, which is what detects dependency drift while
      # the repository is quiet.
      if: matrix.python-version == '3.12'
      shell: bash
      run: |
        uv run --no-sync python - <<'PY'
        import importlib.util
        import tomllib

        with open("pyproject.toml", "rb") as fh:
            config = tomllib.load(fh)
        banned = config["tool"]["ruff"]["lint"]["flake8-tidy-imports"][
            "banned-module-level-imports"
        ]
        leaked = [name for name in banned if importlib.util.find_spec(name) is not None]
        assert not leaked, f"optional modules leaked into the test-over-core environment: {leaked}"
        print(f"optional-module absence confirmed: {len(banned)}/{len(banned)}")
        PY

    - name: Run the test suite
      # On the primary cell only, coverage is measured and gated. The floor lives in
      # [tool.coverage.report] fail_under in pyproject.toml, so this fails when coverage regresses
      # below it; term-missing prints the uncovered lines, which is what a contributor needs to act
      # on the failure without re-running locally.
      #
      # Measured on one cell so the floor keeps one authoritative number. A platform-specific skip
      # on another runner would otherwise fail the gate there for a reason that has nothing to do
      # with coverage regressing.
      run: uv run --no-sync pytest ${{ matrix.primary && '--cov=optimalportfolios --cov-report=term-missing' || '' }}

  wheel:
    # The fourteen `test` cells use the editable installation from the `src/` tree, not the wheel
    # that users receive. A subpackage missing from `[tool.setuptools.packages.find]`, or a data
    # file missing from `[tool.setuptools.package-data]` and MANIFEST.in, can therefore remain
    # invisible to all of them and reach PyPI intact.
    #
    # This job closes that gap, and is the reason the test packages are shipped inside the wheel
    # rather than kept in a top-level `tests/` directory: it builds the wheel, installs it into a
    # clean environment with *no* extras, and runs `pytest --pyargs optimalportfolios` from a
    # directory outside the checkout. That is the post-install check AGENTS.md documents for users,
    # so running it here keeps it a guarantee rather than a claim.
    #
    # One runner, one interpreter: the wheel is `py3-none-any`, so its *contents* do not vary by
    # platform, and the suite's platform behaviour is already covered fourteen ways above. What this
    # job tests is packaging, which is the same everywhere.
    #
    # No `if:` guard. GitHub reports a conditionally skipped job as successful, so a guard on a job
    # that is meant to gate would let the check go green without the wheel ever being built.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"

    - name: Build the wheel from the source distribution
      run: |
        uv build --sdist --clear --out-dir dist
        uv build --wheel dist/*.tar.gz --out-dir dist

    - name: Assert the wheel carries its test packages and fixture
      # `pytest --pyargs` on a wheel with no tests in it exits 5 ("no tests collected"), which is a
      # failure but not a legible one. Naming the missing piece here turns a packaging regression
      # into a message that says which packaging declaration dropped it.
      run: |
        python - <<'PY'
        import glob
        import zipfile

        wheels = glob.glob("dist/*.whl")
        assert len(wheels) == 1, f"expected exactly one wheel, found: {wheels}"
        wheel = wheels[0]
        with zipfile.ZipFile(wheel) as archive:
            names = archive.namelist()
        test_modules = [n for n in names if "/tests/" in n and n.endswith("_test.py")]
        support_modules = {
            "optimalportfolios/tests/data/multiasset.py",
            "optimalportfolios/tests/data_masks.py",
        }
        package_test_modules = {
            n for n in names
            if "/tests/" in n and n.endswith(".py") and not n.endswith("/__init__.py")
        }
        ambiguous_modules = package_test_modules - set(test_modules) - support_modules
        development_modules = {
            n for n in names if "/run_local/" in n or n.endswith("_run.py")
        }
        fixture = "optimalportfolios/tests/data/multiasset_returns.csv"

        assert test_modules, (
            f"{wheel} ships no test modules: check [tool.setuptools.packages.find] in "
            "pyproject.toml, which must keep including the nested `tests` packages"
        )
        assert not ambiguous_modules, (
            f"{wheel} ships non-pytest modules below tests/: {sorted(ambiguous_modules)}"
        )
        assert support_modules <= package_test_modules, (
            f"{wheel} is missing test support modules: {sorted(support_modules - package_test_modules)}"
        )
        assert not development_modules, (
            f"{wheel} ships source-checkout development runners: {sorted(development_modules)}"
        )
        assert fixture in names, (
            f"{wheel} is missing {fixture}: check [tool.setuptools.package-data] and MANIFEST.in"
        )
        print(f"{wheel}: {len(test_modules)} pytest modules, offline fixture present")
        PY

    - name: Install the wheel into a clean environment
      # Core install plus pytest, and nothing else -- no `test` group, `data`, or `reports`. This is
      # what `pip install optimalportfolios` gives a user, so a test that quietly needs an optional
      # extra fails here rather than in their terminal. It is also the module-level-optional-import
      # trap from the other side: such an import breaks *collection*, so it would fail this job even
      # though the ruff TID253 gate and the absence assertion above both look at the source.
      run: |
        uv venv --python 3.12 "$RUNNER_TEMP/wheelcheck-venv"
        uv pip install --python "$RUNNER_TEMP/wheelcheck-venv/bin/python" \
          "$(ls dist/*.whl)" pytest

    - name: Run the shipped suite against the installed wheel
      # `cd` out of the checkout first so neither repository paths nor project configuration can
      # influence package discovery. `--pyargs` then resolves the name through the clean wheel
      # environment's import system.
      #
      # Running outside the repository also means pytest never finds pyproject.toml, so neither
      # `testpaths` nor `addopts` apply -- the package name is passed explicitly for that reason.
      run: |
        mkdir -p "$RUNNER_TEMP/wheelcheck"
        cd "$RUNNER_TEMP/wheelcheck"
        "$RUNNER_TEMP/wheelcheck-venv/bin/python" -m pytest --pyargs optimalportfolios -q
