name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push to a PR branch makes the run already in flight for that branch pointless: the matrix
# is 16 jobs, so cancelling it is the single largest saving available here. Runs on `main` are
# keyed per-ref and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  static:
    # ruff, interrogate and pip-audit each need a Python and nothing else -- no project install,
    # no compiled scientific stack -- and each runs in seconds. As three jobs they paid for three
    # checkouts and three interpreter setups to do that; as one job they share a single setup and
    # a single pip invocation. They stay three separate *steps*, so a failure still names which
    # gate broke.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install the static-analysis tools
      run: |
        python -m pip install --upgrade pip
        # Pinned to their current minor series so a tool release cannot change the verdict on
        # unchanged code or an unchanged dependency tree.
        pip install "ruff~=0.16.0" "interrogate>=1.7" "pip-audit~=2.10.1"

    - name: Check stack invariants and the F family
      # The three stack invariants configured in pyproject.toml -- TID251 (subject packages never
      # import each other), TID253 (an optional extra is never imported at module level) and ICN
      # (the numpy/pandas aliases) -- plus the whole F family, are green across the package, so a
      # finding here is always something the change under review introduced.
      #
      # F is gated and E/W are not, because the legacy backlog AGENTS.md asks be left alone is
      # ~380 E501 line-length findings. F is a correctness family -- an unused import, an undefined
      # name, a dropped assignment -- and was separable from the formatting one.
      run: ruff check --select TID251,TID253,ICN,F optimalportfolios/

    - name: Check docstring coverage
      # Docstring coverage is at 100%, so a miss is always something the change under review
      # introduced. interrogate only parses the AST, so this needs no project dependencies. The
      # threshold and the papers/ exclusion live in [tool.interrogate] in pyproject.toml, and the
      # exclusion resolves against the working directory -- run it from the repository root.
      run: interrogate -v

    - name: Audit the dependency tree for known vulnerabilities
      # Every core dependency is declared as an open-ended floor (`>=`, no upper bound), so the
      # installed set drifts forward on every fresh install and a newly-disclosed advisory would
      # otherwise surface only when someone happened to look.
      #
      # `pip-audit <project_path>` resolves the dependency tree from pyproject.toml without
      # installing it -- 35 packages at the time of writing -- rather than paying for the compiled
      # scientific stack a second time.
      #
      # Hard-fails on purpose: the tree is clean today, so a finding here is either a new advisory
      # or a dependency change under review. If a transitive advisory ever lands that this project
      # cannot act on, prefer `--ignore-vuln <ID>` with a comment naming why over disabling the
      # step, so the exception stays visible.
      run: pip-audit .

  test:
    # The suite is pure-Python and NaN-aware pandas, but the scientific stack ships per-platform
    # wheels and pandas frequency/locale behaviour has bitten this kind of code before, so the
    # matrix runs every supported Python on all three runners.
    #
    # `primary` marks the one cell -- ubuntu/3.12 -- that installs against constraints.txt, runs
    # the offline example and gates coverage. It is set through `include` so the pinned and
    # floating legs are one step each instead of two near-identical pairs; the remaining cells
    # leave it unset, which is falsy in an expression.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            primary: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        # Caches pip's download directory only. Resolution still hits the index every run, so the
        # deliberately floating dependencies keep floating -- this saves the transfer and the
        # wheel build, not the version choice.
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          constraints.txt

    - name: Install the package and its dev extra
      # `--upgrade pip` is load-bearing, not habit: pyproject.toml declares PEP 639 `license` and
      # `license-files`, so the built metadata is Metadata-Version 2.4, which the pip shipped with
      # the older interpreters in this matrix does not understand.
      run: |
        python -m pip install --upgrade pip
        pip install ${{ matrix.primary && '-c constraints.txt' || '' }} -e ".[dev]"

    - name: Verify the public import surface
      # bash on every runner: the default shell on windows-latest is PowerShell, which parses this
      # multi-line quoted argument differently.
      shell: bash
      run: |
        python -c "
        from optimalportfolios import (
            PortfolioObjective, Constraints, GroupLowerUpperConstraints,
            FactorCovarEstimator, EwmaCovarEstimator
        )
        from factorlasso import LassoModel as FL_LassoModel
        from optimalportfolios import LassoModel as OP_LassoModel
        assert FL_LassoModel is OP_LassoModel, 'factorlasso re-export mismatch'
        print('imports and factorlasso integration OK')
        "

    - name: Smoke-test the offline multi-asset example
      if: matrix.primary
      run: python optimalportfolios/examples/backtests/multiasset_saa.py

    - name: Run the test suite
      # On the primary cell only, coverage is measured and gated. The floor lives in
      # [tool.coverage.report] fail_under in pyproject.toml, so this fails when coverage regresses
      # below it; term-missing prints the uncovered lines, which is what a contributor needs to act
      # on the failure without re-running locally.
      #
      # Measured on one cell so the floor keeps one authoritative number. A platform-specific skip
      # on another runner would otherwise fail the gate there for a reason that has nothing to do
      # with coverage regressing.
      run: pytest ${{ matrix.primary && '--cov=optimalportfolios --cov-report=term-missing' || '' }}

  core-install:
    # The suite must stay green without the optional extras: no test may need data, network or a
    # Bloomberg terminal. Without this job the constraint is a convention, and it has already been
    # broken twice by a module-scope yfinance import.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install the core package only
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest

    - name: Assert the optional extras are absent
      shell: bash
      run: |
        python -c "
        import importlib.util
        for name in ('yfinance', 'pandas_datareader', 'pybloqs'):
            assert importlib.util.find_spec(name) is None, f'{name} leaked into the core install'
        print('core install confirmed')
        "

    - name: Run the test suite on a core install
      run: pytest
