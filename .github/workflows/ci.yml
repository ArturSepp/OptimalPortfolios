name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  lint:
    # The three stack invariants configured in pyproject.toml -- TID251 (subject packages
    # never import each other), TID253 (an optional extra is never imported at module
    # level) and ICN (the numpy/pandas aliases) -- plus the whole F family, are green
    # across the package, so a finding here is always something the change under review
    # introduced.
    #
    # F is gated and E/W are not, because the legacy backlog AGENTS.md asks be left alone
    # is ~380 E501 line-length findings. F is a correctness family -- an unused import, an
    # undefined name, a dropped assignment -- and was separable from the formatting one.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        # Pin the current Ruff 0.16 minor series for reproducible lint results.
        pip install "ruff~=0.16.0"

    - name: Check stack invariants and the F family
      run: ruff check --select TID251,TID253,ICN,F optimalportfolios/

  test:
    # The suite is pure-Python and NaN-aware pandas, but the scientific stack ships
    # per-platform wheels and pandas frequency/locale behaviour has bitten this kind of
    # code before, so the matrix runs every supported Python on all three runners.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install pinned coverage dependencies
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: |
        python -m pip install --upgrade pip
        pip install -c constraints.txt -e ".[dev]"

    - name: Install floating test dependencies
      if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify imports
      # bash on every runner: the default shell on windows-latest is PowerShell, which
      # parses this multi-line quoted argument differently.
      shell: bash
      run: |
        python -c "
        from optimalportfolios import (
            PortfolioObjective, Constraints, GroupLowerUpperConstraints,
            FactorCovarEstimator, EwmaCovarEstimator
        )
        print('All imports OK')
        "

    - name: Verify factorlasso integration
      shell: bash
      run: |
        python -c "
        from factorlasso import LassoModel as FL_LassoModel
        from optimalportfolios import LassoModel as OP_LassoModel
        assert FL_LassoModel is OP_LassoModel, 'Re-export mismatch'
        print('factorlasso integration OK')
        "

    - name: Smoke-test the offline multi-asset example
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: python optimalportfolios/examples/backtests/multiasset_saa.py

    - name: Run the test suite with coverage gate
      # The floor lives in [tool.coverage.report] fail_under in pyproject.toml, so this job
      # fails when coverage regresses below it. term-missing prints the uncovered lines, which
      # is what a contributor needs to act on the failure without re-running locally.
      #
      # Measured on ubuntu/3.12 only, so the floor keeps one authoritative number. A
      # platform-specific skip on another runner would otherwise fail the gate there for
      # a reason that has nothing to do with coverage regressing.
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      run: pytest --cov=optimalportfolios --cov-report=term-missing

    - name: Run the test suite
      if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
      run: pytest

  docstrings:
    # Docstring coverage is at 100%, so a miss is always something the change
    # under review introduced. interrogate only parses the AST, so this needs
    # no project dependencies and stays a seconds-long job. The threshold and
    # the papers/ exclusion live in [tool.interrogate] in pyproject.toml.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install interrogate
      run: |
        python -m pip install --upgrade pip
        pip install "interrogate>=1.7"

    - name: Check docstring coverage
      run: interrogate -v

  audit:
    # Every core dependency is declared as an open-ended floor (`>=`, no upper bound),
    # so the installed set drifts forward on every fresh install and a newly-disclosed
    # advisory would otherwise surface only when someone happened to look.
    #
    # `pip-audit <project_path>` resolves the dependency tree from pyproject.toml
    # without installing it -- 35 packages at the time of writing -- so this stays a
    # seconds-long job like the docstrings one, rather than paying for the compiled
    # scientific stack a second time.
    #
    # Hard-fails on purpose: the tree is clean today, so a finding here is either a new
    # advisory or a dependency change under review. If a transitive advisory ever lands
    # that this project cannot act on, prefer `--ignore-vuln <ID>` with a comment naming
    # why over disabling the job, so the exception stays visible.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        # Pin the current pip-audit 2.10 minor series, as the lint job pins ruff, so a
        # tool release cannot change the verdict on an unchanged dependency tree.
        pip install "pip-audit~=2.10.1"

    - name: Audit the dependency tree for known vulnerabilities
      run: pip-audit .

  core-install:
    # The suite must stay green without the optional extras: no test may need
    # data, network or a Bloomberg terminal. Without this job the constraint is
    # a convention, and it has already been broken twice by a module-scope
    # yfinance import.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install the core package only
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Assert the optional extras are absent
      shell: bash
      run: |
        python -c "
        import importlib.util
        for name in ('yfinance', 'pandas_datareader', 'pybloqs'):
            assert importlib.util.find_spec(name) is None, f'{name} leaked into the core install'
        print('core install confirmed')
        "

    - name: Run the test suite on a core install
      run: pytest
