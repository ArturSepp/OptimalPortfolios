name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push to a PR branch makes the run already in flight for that branch pointless: this workflow
# is 13 jobs, so cancelling it is the single largest saving available here. Runs on `main` are
# keyed per-ref and never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

# This workflow is the part of CI that needs the package installed. The checks that do not --
# ruff, interrogate, pip-audit -- live in static.yml and run in parallel with it.
jobs:
  test:
    # The suite is pure-Python and NaN-aware pandas, but the scientific stack ships per-platform
    # wheels and pandas frequency/locale behaviour has bitten this kind of code before, so the
    # matrix runs every supported Python on all three runners.
    #
    # `primary` marks the one cell -- ubuntu/3.12 -- that syncs `--locked` from uv.lock, runs the
    # offline example and gates coverage. It is set through `include` so the pinned and floating
    # legs are one step each instead of two near-identical pairs; the remaining cells leave it
    # unset, which is falsy in an expression.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            primary: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        # uv supplies the interpreter as well as the installer, so there is no separate
        # setup-python step. The version has to be passed explicitly: `.python-version` is
        # gitignored, so there is no in-repo file for uv to discover.
        python-version: ${{ matrix.python-version }}
        # `enable-cache` defaults to `auto` -- on for push and pull_request on GitHub-hosted
        # runners -- and the default `cache-dependency-glob` already covers pyproject.toml and
        # uv.lock. The cache holds downloaded and built wheels, not a resolution, so the
        # deliberately floating cells keep floating.

    - name: Sync the environment
      # The pinned and floating legs differ by one flag rather than by a whole step.
      #
      # `--locked` on the primary cell installs the lock exactly and *fails* if uv.lock has
      # drifted from pyproject.toml, which is what stops a dependency edit landing without a
      # re-lock. Everywhere else `--upgrade` re-resolves from the floors and ignores the lock, so
      # the matrix keeps testing what a user installing today would actually get. That float is
      # the point of the other eleven cells; pinning them would only test the lock twelve times.
      #
      # No pip bootstrap step: pyproject.toml declares PEP 639 `license` and `license-files`, so
      # the built metadata is Metadata-Version 2.4. The pip shipped with the older interpreters in
      # this matrix cannot read that and had to be upgraded first; uv reads it natively.
      run: uv sync --extra dev ${{ matrix.primary && '--locked' || '--upgrade' }}

    - name: Verify the public import surface
      # bash on every runner: the default shell on windows-latest is PowerShell, which parses this
      # multi-line quoted argument differently.
      shell: bash
      run: |
        uv run python -c "
        from optimalportfolios import (
            PortfolioObjective, Constraints, GroupLowerUpperConstraints,
            FactorCovarEstimator, EwmaCovarEstimator
        )
        from factorlasso import LassoModel as FL_LassoModel
        from optimalportfolios import LassoModel as OP_LassoModel
        assert FL_LassoModel is OP_LassoModel, 'factorlasso re-export mismatch'
        print('imports and factorlasso integration OK')
        "

    - name: Smoke-test the offline multi-asset example
      if: matrix.primary
      run: uv run python optimalportfolios/examples/backtests/multiasset_saa.py

    - name: Run the test suite
      # On the primary cell only, coverage is measured and gated. The floor lives in
      # [tool.coverage.report] fail_under in pyproject.toml, so this fails when coverage regresses
      # below it; term-missing prints the uncovered lines, which is what a contributor needs to act
      # on the failure without re-running locally.
      #
      # Measured on one cell so the floor keeps one authoritative number. A platform-specific skip
      # on another runner would otherwise fail the gate there for a reason that has nothing to do
      # with coverage regressing.
      run: uv run pytest ${{ matrix.primary && '--cov=optimalportfolios --cov-report=term-missing' || '' }}

  core-install:
    # The suite must stay green without the optional extras: no test may need data, network or a
    # Bloomberg terminal. Without this job the constraint is a convention, and it has already been
    # broken twice by a module-scope yfinance import.
    #
    # One runner, not the three the `test` job uses. What this job uniquely establishes -- that the
    # package imports and the suite passes with no extras installed -- is a property of the
    # dependency graph, and that is invariant across platforms: a module-scope import of an extra
    # fails identically everywhere. Genuine per-platform breakage is already covered by `test`,
    # which runs all three runners against a superset of these dependencies, so a second and third
    # runner here re-derived one bit of information at the cost of the whole suite each time.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      with:
        python-version: "3.12"

    - name: Sync the core environment
      # A bare `uv sync` is exactly the core install: it takes no extras, and `lint` is a
      # non-default dependency-group, so neither the optional extras nor the tools are present.
      # That is why there is no longer a step asserting their absence -- the environment cannot
      # contain them by construction, where before it was built loosely and then interrogated.
      #
      # What that assertion uniquely caught, a core dependency taking an optional module on as a
      # hard requirement, is a *drift* signal and cannot be seen from a locked environment at all.
      # It moved to the daily fresh resolution in audit.yml, which is where drift belongs.
      run: uv sync --locked

    - name: Run the test suite on a core install
      # `--with pytest` layers the runner on top of the synced environment instead of installing
      # it into it, so the thing under test stays a core install exactly. pytest brings only
      # iniconfig, packaging and pluggy, none of which is an optional extra.
      run: uv run --with pytest pytest
