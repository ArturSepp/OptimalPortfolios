# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: Documentation

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      TRADABLEFACTORS_READ_TOKEN:
        required: false
      FACTORMODELS_READ_SSH_KEY:
        required: false
    inputs:
      online:
        type: boolean
        default: false
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep documentation state outside the checkout
        # runner context is unavailable in job-level env; initialize it on the runner.
        run: |
          echo "AGENT_LOCAL_ROOT=$RUNNER_TEMP/documentation" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/documentation/venv" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/documentation/cache/python" >> "$GITHUB_ENV"
          echo "NUMBA_CACHE_DIR=$RUNNER_TEMP/documentation/cache/numba" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/documentation/cache/matplotlib" >> "$GITHUB_ENV"
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: false
          save-cache: false
          version: "0.12.23"
      - name: Sync documentation environment
        run: uv sync --locked --extra docs --extra riskbudget --group test
      - name: Test private dependency containment
        run: python -m unittest discover -s .github/scripts -p private_dependency_test.py
      - name: Verify the private dependency boundary
        env:
          FM_SOURCE_SHA: ${{ vars.TRADABLEFACTORS_REF }}
          FM_READ_CREDENTIAL_PRESENT: ${{ secrets.FACTORMODELS_READ_SSH_KEY != '' || secrets.TRADABLEFACTORS_READ_TOKEN != '' }}
        run: python .github/scripts/private_dependency.py check-config
      - name: Check out the explicitly selected factor documentation dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArturSepp/FactorModels
          ref: ${{ vars.TRADABLEFACTORS_REF }}
          path: .integration/tradablefactors
          ssh-key: ${{ secrets.FACTORMODELS_READ_SSH_KEY }}
          token: ${{ secrets.TRADABLEFACTORS_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Verify the checked-out dependency identity
        env:
          FM_SOURCE_SHA: ${{ vars.TRADABLEFACTORS_REF }}
        run: >-
          python .github/scripts/private_dependency.py run checkout-identity --
          python -c "import os,subprocess; actual=subprocess.check_output(['git','-C','.integration/tradablefactors','rev-parse','HEAD'],text=True).strip(); assert actual.lower()==os.environ['FM_SOURCE_SHA'].lower()"
      - name: Install the selected FM candidate for the complete analytical bundle
        run: python .github/scripts/private_dependency.py run install-docs -- uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" .integration/tradablefactors
      - name: Check every human-authored source
        run: python .github/scripts/private_dependency.py run check-source -- uv run --no-sync python tools/check_docs.py --source-all
      - name: Test source-checker regressions
        run: >-
          python .github/scripts/private_dependency.py run source-regressions -- uv run --no-sync python -m pytest
          src/optimalportfolios/tests/documentation_standard_test.py
          -o cache_dir="$AGENT_LOCAL_ROOT/cache/pytest"
          --basetemp="$AGENT_LOCAL_ROOT/tests"
      - name: Check displayed-image registration
        run: python .github/scripts/private_dependency.py run list-images -- uv run --no-sync python -m tools.docs_analytics.run --list
      - name: Verify published preview integrity and teaching exhibits
        run: python .github/scripts/private_dependency.py run verify-images -- uv run --no-sync python -m tools.docs_analytics.run --verify
      - name: Generate and validate the complete offline analytics bundle
        run: >-
          python .github/scripts/private_dependency.py run generate-images -- uv run --no-sync python -m tools.docs_analytics.run --all
          --output-root "$AGENT_LOCAL_ROOT/bundle"
      - name: Build documentation with the shared profile
        run: python .github/scripts/private_dependency.py run build-docs -- uv run --no-sync python .github/oss_checks.py docs --working-tree --output-dir "$RUNNER_TEMP/oss-docs"
      - name: Test external-link failure classification
        run: python .github/scripts/private_dependency.py run test-links -- uv run --no-sync python .github/scripts/test_external_links.py
      - name: Check documentation links
        if: inputs.online || github.event_name == 'workflow_dispatch'
        run: >-
          python .github/scripts/private_dependency.py run check-links -- uv run --no-sync python .github/scripts/check_external_links.py
          --output-dir "$AGENT_LOCAL_ROOT/linkcheck"
      - name: Confirm the reviewed lockfile was preserved
        run: python .github/scripts/private_dependency.py run lock-preserved -- git diff --exit-code -- pyproject.toml uv.lock

      # Only this fixed-schema status is public; full reports stay on the runner.
      - name: Retain external-link health status
        if: always() && (inputs.online || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: external-link-health
          path: ${{ runner.temp }}/private-factor-checks/check-links.status.json
          if-no-files-found: error
