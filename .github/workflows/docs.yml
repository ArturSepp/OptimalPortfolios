# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: Documentation

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      online:
        type: boolean
        default: false
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep documentation state outside the checkout
        # runner context is unavailable in job-level env; initialize it on the runner.
        run: |
          echo "AGENT_LOCAL_ROOT=$RUNNER_TEMP/documentation" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/documentation/venv" >> "$GITHUB_ENV"
          echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/documentation/cache/python" >> "$GITHUB_ENV"
          echo "NUMBA_CACHE_DIR=$RUNNER_TEMP/documentation/cache/numba" >> "$GITHUB_ENV"
          echo "MPLCONFIGDIR=$RUNNER_TEMP/documentation/cache/matplotlib" >> "$GITHUB_ENV"
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.13"
      - name: Sync documentation environment
        run: uv sync --locked --extra docs --group test
      - name: Check every human-authored source
        run: uv run --no-sync python tools/check_docs.py --source-all
      - name: Test source-checker regressions
        run: >-
          uv run --no-sync python -m pytest
          src/optimalportfolios/tests/documentation_standard_test.py
          -o cache_dir="$AGENT_LOCAL_ROOT/cache/pytest"
          --basetemp="$AGENT_LOCAL_ROOT/tests"
      - name: Check displayed-image registration
        run: uv run --no-sync python -m tools.docs_analytics.run --list
      - name: Verify published preview integrity
        run: uv run --no-sync python -m tools.docs_analytics.publish --verify --repo-root "$PWD"
      - name: Generate and validate the complete offline analytics bundle
        run: >-
          uv run --no-sync python -m tools.docs_analytics.run --all
          --output-root "$AGENT_LOCAL_ROOT/bundle"
      - name: Build documentation with the shared profile
        run: uv run --no-sync python .github/oss_checks.py docs --working-tree --output-dir "$RUNNER_TEMP/oss-docs"
      - name: Check documentation links
        if: inputs.online || github.event_name == 'workflow_dispatch'
        run: >-
          uv run --no-sync python -m sphinx -E -W
          -D linkcheck_workers=1 -b linkcheck docs "$AGENT_LOCAL_ROOT/linkcheck"
      - name: Confirm the reviewed lockfile was preserved
        run: git diff --exit-code -- pyproject.toml uv.lock
