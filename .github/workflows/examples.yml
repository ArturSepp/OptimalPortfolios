# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: Examples

# Least privilege, declared rather than inherited; see the fuller note in ci.yml. Both lanes check
# out the tree, install, and run example scripts. The network lane additionally writes a report to
# `$GITHUB_STEP_SUMMARY`, which is a file write on the runner and needs no permission -- so
# `contents: read` covers this workflow too.
#
# This one has the strongest case of the four: the network lane executes example code that
# downloads from Yahoo Finance, on a schedule, unattended. Whatever that code does, it should not do
# it holding a writable repository token.
permissions:
  contents: read

# `examples/` is the one part of the tree nothing else executes. It is excluded from wheels,
# dropped by `[tool.coverage.run] omit`, and never collected by pytest, so an example can reference
# an API that no longer exists and stay broken indefinitely. Ruff does not close the gap either:
# the rot these scripts attract is attribute-level rather than name-level -- an enum member that
# was renamed upstream is still a valid attribute access. That is not hypothetical. This workflow
# was added after `LassoModelType.GROUP_LASSO_CLUSTERS` was found broken in two examples, a shipped
# docstring and three documents.
#
# Triggers are unconditional rather than filtered on `examples/**`, because an example breaks far
# more often from a change to the package it calls than from an edit to itself.
on:
  workflow_call:
    secrets:
      TRADABLEFACTORS_READ_TOKEN:
        required: false
      FACTORMODELS_READ_SSH_KEY:
        required: false
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  offline:
    # The examples that need no network, on all three runners. This job gates.
    #
    # Risk-budget examples explicitly install their backend. The base test/wheel lanes
    # separately verify ordinary imports and the offline minimum-variance quickstart.
    #
    # 3.12 only. Unlike the test matrix, what is being checked is that a script still lines up
    # with the API it calls, and that does not vary by interpreter; the three runners are here
    # because the *paths and backends* do.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"

    - name: Sync the offline examples and risk-budgeting backend
      run: uv sync --locked --extra riskbudget

    - name: Check the Colab notebook mirror
      # The notebook carries one cell tagged `d6-source`; this standard-library check compares it
      # byte-for-byte with the authoritative Python quickstart and rejects saved execution output.
      # It also preserves the released-package install, runtime version, and required links.
      run: uv run --no-sync python .github/scripts/check_quickstart_notebook.py

    - name: Run the offline examples
      # The lane is derived, not listed. `run_examples.py` walks each example's intra-`examples`
      # import closure and calls it network-bound if `yfinance` is reachable at all -- thirteen of
      # them touch the network only through `examples/data/universe.py`, and an explicit path list
      # would be wrong the first time someone adds an example. The script fails on an empty lane,
      # so a classification bug cannot report success by running nothing.
      run: uv run --no-sync python .github/scripts/run_examples.py --lane offline

  network:
    # The nineteen examples that download from Yahoo Finance, on a schedule, advisory only.
    #
    # These are not on the pull-request path on purpose. `examples/data/universe.py` pulls 15
    # tickers back to 2003, so gating a PR on them would mean dozens of live downloads per run and
    # a check that fails on Yahoo's availability far more often than on anything in the diff. A
    # check that is usually red for reasons outside
    # the change is one people learn to ignore, which costs more than it buys.
    #
    # On the job-level `if`: static.yml carries a comment explaining why a guard there was unsound,
    # and the distinction matters. A skipped job reports *success*, so a guard is only safe on a
    # job that must never gate anything. This one qualifies twice over -- it is excluded from the
    # PR path by this condition, and `continue-on-error` means even a real failure does not fail
    # the run. Do not add this job to branch protection; if you ever want it to gate, delete both
    # mechanisms rather than trusting the guard.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"
        enable-cache: false
        save-cache: false

    - name: Sync with the data extra
      # `data` is the extra these examples actually need; syncing `--all-extras` would install
      # the reporting and docs stacks to run scripts that use neither.
      run: uv sync --locked --extra data --extra riskbudget

    - name: Test private dependency containment
      run: python -m unittest discover -s .github/scripts -p private_dependency_test.py
    - name: Verify the private dependency boundary
      env:
        FM_SOURCE_SHA: ${{ vars.TRADABLEFACTORS_REF }}
        FM_READ_CREDENTIAL_PRESENT: ${{ secrets.FACTORMODELS_READ_SSH_KEY != '' || secrets.TRADABLEFACTORS_READ_TOKEN != '' }}
      run: python .github/scripts/private_dependency.py check-config
    - name: Check out the explicitly selected factor pipeline
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ArturSepp/FactorModels
        ref: ${{ vars.TRADABLEFACTORS_REF }}
        path: .integration/tradablefactors
        ssh-key: ${{ secrets.FACTORMODELS_READ_SSH_KEY }}
        token: ${{ secrets.TRADABLEFACTORS_READ_TOKEN || github.token }}
        persist-credentials: false
    - name: Verify the checked-out dependency identity
      env:
        FM_SOURCE_SHA: ${{ vars.TRADABLEFACTORS_REF }}
      run: >-
        python .github/scripts/private_dependency.py run checkout-identity --
        python -c "import os,subprocess; actual=subprocess.check_output(['git','-C','.integration/tradablefactors','rev-parse','HEAD'],text=True).strip(); assert actual.lower()==os.environ['FM_SOURCE_SHA'].lower()"

    - name: Install FM explicitly for network examples that compose the factor pipeline
      run: python .github/scripts/private_dependency.py run install-network -- uv pip install --python .venv/bin/python .integration/tradablefactors

    - name: Run the network examples
      # `--jobs 4` rather than the default: these are all hitting one host, and Yahoo rate-limits.
      # Serialising entirely would take too long; four is a compromise that has to be tuned by
      # observation, not derived.
      #
      # Keep output private; the controlled summary below still exposes the advisory outcome.
      id: run
      shell: bash
      run: |
        python .github/scripts/private_dependency.py run network-examples -- \
          uv run --no-sync python .github/scripts/run_examples.py --lane network --jobs 4

    - name: Summarise
      # Runs whatever the step above did. `continue-on-error` turns a failed job green in the UI,
      # so without this the whole point of the lane -- noticing rot -- would depend on someone
      # opening a passing run's logs, which nobody does.
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        {
          echo "## Network examples"
          echo
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            echo "All network examples passed."
          else
            echo "**Some network examples failed.** This lane is advisory: the cause is often"
            echo "Yahoo Finance rather than this repository. Use the private-host verification"
            echo "for full diagnostics."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
