# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: JOSS paper

# This workflow is intentionally path-filtered: it validates and renders the manuscript, not the
# Python package. It should not be made a required check for unrelated pull requests because GitHub
# reports a path-filtered workflow as pending when no matching path starts it.
on:
  push:
    paths:
      - 'paper.md'
      - 'paper.bib'
      - '.github/scripts/check_joss_paper.py'
      - '.github/scripts/check_joss_paper_test.py'
      - '.github/workflows/joss-paper.yml'
  pull_request:
    paths:
      - 'paper.md'
      - 'paper.bib'
      - '.github/scripts/check_joss_paper.py'
      - '.github/scripts/check_joss_paper_test.py'
      - '.github/workflows/joss-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_HTTP_RETRIES: "5"
  UV_HTTP_TIMEOUT: "60"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'

      - name: Validate the manuscript
        run: uv run --no-project --python 3.12 python .github/scripts/check_joss_paper.py

      - name: Prove the failure cases
        run: >-
          uv run --no-project --python 3.12 python -m unittest discover
          -s .github/scripts -p check_joss_paper_test.py -v

  build:
    name: Build draft PDF
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile with the Open Journals renderer
        # Open Journals does not publish version tags for this action. This immutable revision was
        # the tip of its master branch when the workflow was created on 2026-08-21.
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c
        with:
          journal: joss
          paper-path: paper.md

      - name: Upload the draft PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optimalportfolios-joss-paper
          path: paper.pdf
          if-no-files-found: error
          retention-days: 14
