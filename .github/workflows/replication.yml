# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: Replication

# The package test matrix deliberately collects only src/optimalportfolios. This separate gate
# covers the public, offline subset of papers/: the shared CMA snapshot. Paper projects that are
# gitignored or require network or licensed inputs remain manual.
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg

jobs:
  replication:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python 3.12
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install the locked test environment
      run: uv sync --group test --locked

    - name: Verify the public CMA snapshot
      run: >-
        uv run --no-sync pytest
        papers/cma_data/tests
        -q
